[build-system]
requires = ["setuptools==80.9.0", "wheel==0.45.1"]
build-backend = "setuptools.build_meta"

[project]
name = "robobuilder"
version = "1.0.0"
description = "RoboBuilder: coding agents co-design robots (hardware and program) from standard parts, in a learned simulator and on real courses"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Ghadi Nehme" }]
requires-python = ">=3.12,<3.13"
dependencies = [
    "numpy==2.5.3",
    "scipy==1.17.0",
    "mujoco==3.12.0",
    "trimesh==5.1.1",
    "rtree==1.4.1",
    "manifold3d==3.5.4",
    "cadquery==2.5.2",
    "imageio-ffmpeg==0.6.0",
]

[project.optional-dependencies]
test = ["pytest==9.1.1"]

[project.scripts]
robobuilder = "robobuilder.cli:main"

[tool.setuptools.packages.find]
include = ["robobuilder*"]

[tool.setuptools.package-data]
robobuilder = ["core/data/*.json", "core/data/parts/*.json", "sim/params/*.json", "sim/geom/*.npz"]
